name: Build Android64

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: geode-sdk/build-geode-mod@main
        id: build
        with:
          sdk: 'v5.11.2'
          target: Android64
      - uses: actions/upload-artifact@v4
        with:
          name: GatoBot-Android64
          path: ${{ steps.build.outputs.build-output }}
